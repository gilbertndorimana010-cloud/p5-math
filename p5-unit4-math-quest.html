<style>
  :root{
    --navy:#1b2a6b; --blue:#2563eb; --purple:#7c3aed;
    --bg:#eef2ff; --card:#ffffff; --ink:#14214d;
    --good:#16a34a; --bad:#dc2626;

  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}

  .card{background:var(--card);border:2px solid #bfdbfe;border-radius:22px;margin:-14px 16px 24px;padding:18px;box-shadow:0 8px 24px rgba(37,99,235,.15)}

  input[type=text]{width:100%;padding:14px;font-size:18px;border:2px solid #bfdbfe;border-radius:12px;margin-top:12px}
  .center{text-align:center}

  /* stacked fractions */
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.15;font-size:.92em}
  .fr>span:first-child{border-bottom:2px solid currentColor;padding:0 5px 1px}
  .fr>span:last-child{padding:1px 5px 0}

<script>
/* ============ 1. EDIT THESE SETTINGS ============ */
const CONFIG = {
  school: "🎓 EP APPEC REMERA RUKOMA",
  title:  "🌟 P5 MATHEMATICS QUEST • UNIT 4 🌟",
  topics: "Equivalent Fractions • Adding & Subtracting Fractions • Mixed Numbers",
  quote:  "“Every problem is a chance to discover how brilliant you are!”",
  teacherName: "Gilbert NDORIMANA",
  teacherPhone: "0792441035",     // shown on the page
  teacherWhatsApp: "250792441035", // Rwanda code 250 + number without the first 0
  total:  50,         // number of questions
  pointsPerCorrect: 10
};

/* ============ 2. QUESTION MAKERS ============ */
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a=>a[rnd(0,a.length-1)];
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd = (a,b)=>b?gcd(b,a%b):a;
const lcm = (a,b)=>a/gcd(a,b)*b;

// Fractions are written as text: "3/4" or "2 1/3" (mixed number). "□" marks a missing number.
// Turns that text into nicely stacked fractions on screen.
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function toHTML(s){
  return esc(s).replace(/(?:(\d+) )?(\d+|□)\/(\d+|□)/g,(m,w,n,d)=>
    (w?`<span class="w">${w}</span>`:"")+`<span class="fr"><span>${n}</span><span>${d}</span></span>`);
}

// simplest form: improper fractions become mixed numbers, whole numbers stay whole
function fmtFrac(n,d){
  if(n<=0) return "0";
  const g=gcd(n,d); n/=g; d/=g;
  if(d===1) return String(n);
  if(n>d) return `${Math.floor(n/d)} ${n%d}/${d}`;
  return `${n}/${d}`;
}
// numeric value of "3/4", "2 1/3" or "7"
function val(s){
  s=String(s).trim();
  let m=s.match(/^(\d+) (\d+)\/(\d+)$/); if(m) return +m[1]+(+m[2])/(+m[3]);
  m=s.match(/^(\d+)\/(\d+)$/); if(m) return (+m[1])/(+m[2]);
  return Number(s);
}

// builds 4 unique options: the correct one + 3 wrong ones made by gen()
// strict = compare the written form (so "6/9" and "2/3" count as different options)
function build(cat,text,correct,gen,why,strict){
  correct=String(correct);
  const opts=[correct]; let tries=0;
  while(opts.length<4 && tries++<500){
    const g=String(gen()), v=val(g);
    if(!(v>0) || !isFinite(v)) continue;
    if(opts.some(o=> strict ? o===g : Math.abs(val(o)-v)<1e-9)) continue;
    opts.push(g);
  }
  return {cat,text,answer:correct,options:shuffle(opts),why};
}

const NAMES=["Uwase","Kalisa","Mutesi","Habimana","Iradukunda","Ingabire","Niyonsenga","Uwimana"];
const coprimePair=(lo,hi)=>{ let a,b; do{ b=rnd(lo,hi); a=rnd(1,b-1); }while(gcd(a,b)!==1); return [a,b]; };

// two different denominators whose common denominator is not too big
function pairD(){
  const ds=[2,3,4,5,6,8,10,12]; let d1,d2;
  do{ d1=pick(ds); d2=pick(ds); }while(d1===d2||lcm(d1,d2)>24);
  return [d1,d2];
}
function unlikeAdd(){
  const [d1,d2]=pairD(), a=rnd(1,d1-1), c=rnd(1,d2-1), L=lcm(d1,d2);
  const A=a*L/d1, C=c*L/d2, N=A+C, ans=fmtFrac(N,L);
  const why=`The common denominator is ${L}. ${a}/${d1} = ${A}/${L} and ${c}/${d2} = ${C}/${L}. Sum = ${N}/${L}`+(ans!==`${N}/${L}`?` = ${ans}`:"")+".";
  const wrong=()=>pick([fmtFrac(a+c,d1+d2),fmtFrac(a+c,L),fmtFrac(N+rnd(-3,3),L),fmtFrac(N+rnd(1,4),L)]);
  return {d1,d2,a,c,ans,why,wrong};
}
function unlikeSub(){
  let d1,d2,a,c,L,A,C;
  do{ [d1,d2]=pairD(); a=rnd(1,d1-1); c=rnd(1,d2-1); L=lcm(d1,d2); A=a*L/d1; C=c*L/d2; }while(A<=C);
  const N=A-C, ans=fmtFrac(N,L);
  const why=`The common denominator is ${L}. ${a}/${d1} = ${A}/${L} and ${c}/${d2} = ${C}/${L}. Difference = ${N}/${L}`+(ans!==`${N}/${L}`?` = ${ans}`:"")+".";
  const wrong=()=>pick([fmtFrac(Math.abs(a-c)||1,Math.abs(d1-d2)||1),fmtFrac(N+rnd(-3,3),L),fmtFrac(N+rnd(1,4),L),fmtFrac(A+C,L)]);
  return {d1,d2,a,c,ans,why,wrong};
}

const makers=[
  // 1. Types of fractions
  ()=>{ const kind=rnd(0,2);
    const P=()=>{ const d=rnd(3,12); return `${rnd(1,d-1)}/${d}`; };
    const I=()=>{ let d,n; do{ d=rnd(2,9); n=rnd(d+1,2*d+4); }while(n%d===0); return `${n}/${d}`; };
    const M=()=>{ const d=rnd(3,9); return `${rnd(1,5)} ${rnd(1,d-1)}/${d}`; };
    if(kind===0){ const c=P();
      return build("Types of Fractions","Which of these is a proper fraction?",c,()=>pick([I(),M()]),
        `In ${c} the numerator is smaller than the denominator, so it is a proper fraction.`); }
    if(kind===1){ const c=I();
      return build("Types of Fractions","Which of these is an improper fraction?",c,()=>pick([P(),M()]),
        `In ${c} the numerator is bigger than the denominator, so it is an improper fraction.`); }
    const c=M();
    return build("Types of Fractions","Which of these is a mixed number?",c,()=>pick([P(),I()]),
      `${c} is a whole number together with a fraction, so it is a mixed number.`); },

  // 2. Missing number in equivalent fractions
  ()=>{ const [a,b]=coprimePair(2,9), k=rnd(2,6), miss=rnd(0,1);
    if(miss){ const ans=b*k;
      return build("Equivalent Fractions",`Find the missing number: ${a}/${b} = ${a*k}/□`,ans,
        ()=>pick([ans+rnd(-4,4),b+k,ans+rnd(1,6)]),
        `${a} × ${k} = ${a*k}, so multiply the denominator by ${k} too: ${b} × ${k} = ${b*k}.`); }
    const ans=a*k;
    return build("Equivalent Fractions",`Find the missing number: ${a}/${b} = □/${b*k}`,ans,
      ()=>pick([ans+rnd(-4,4),a+k,ans+rnd(1,6)]),
      `${b} × ${k} = ${b*k}, so multiply the numerator by ${k} too: ${a} × ${k} = ${a*k}.`); },

  // 3. Which fraction is equivalent?
  ()=>{ const [a,b]=coprimePair(2,9), k=rnd(2,5), c=`${a*k}/${b*k}`;
    return build("Equivalent Fractions",`Which fraction is equivalent to ${a}/${b}?`,c,
      ()=>pick([`${a+k}/${b+k}`,`${a*k}/${b*k+rnd(1,3)}`,`${a*k+rnd(1,2)}/${b*k}`,`${a*rnd(2,5)}/${b*rnd(2,5)}`]),
      `Multiply the top and the bottom by ${k}: ${a} × ${k} = ${a*k} and ${b} × ${k} = ${b*k}.`); },

  // 4. Simplify
  ()=>{ const [na,nd]=coprimePair(2,9), g=pick([2,3,4,5,6]), a=na*g, b=nd*g, c=`${na}/${nd}`;
    const parts=[]; for(let p=2;p<g;p++) if(g%p===0) parts.push(`${a/p}/${b/p}`);
    return build("Simplifying Fractions",`Simplify ${a}/${b} to its lowest terms.`,c,
      ()=>pick([...parts,`${na}/${nd+1}`,`${na+1}/${nd}`,`${a}/${b}`,`${nd}/${na}`]),
      `Divide the top and the bottom by ${g}: ${a} ÷ ${g} = ${na} and ${b} ÷ ${g} = ${nd}. So ${a}/${b} = ${c}.`,true); },

  // 5. Compare two fractions
  ()=>{ let b=rnd(2,12), d=rnd(2,12), a=rnd(1,b-1), c=rnd(1,d-1);
    if(rnd(0,4)===0){ const k=rnd(2,3); d=b*k; c=a*k; }
    const x=a*d, y=c*b, sym=x>y?">":x<y?"<":"=";
    return {cat:"Comparing Fractions",text:`Which symbol makes this true? ${a}/${b} ___ ${c}/${d}`,answer:sym,
      options:shuffle([">","<","="]),
      why:`Cross-multiply: ${a} × ${d} = ${x} and ${c} × ${b} = ${y}. So ${a}/${b} ${sym} ${c}/${d}.`}; },

  // 6. Largest / smallest of four fractions
  ()=>{ const ds=[2,3,4,6,12], set=[]; let t=0;
    while(set.length<4 && t++<300){ const d=pick(ds), n=rnd(1,d-1), f=`${n}/${d}`;
      if(!set.some(s=>Math.abs(val(s)-val(f))<1e-9)) set.push(f); }
    const small=rnd(0,1)===1, sorted=[...set].sort((p,q)=>val(p)-val(q)), c=small?sorted[0]:sorted[3];
    const twelfths=set.map(f=>{ const [n,d]=f.split("/").map(Number); return `${f} = ${n*12/d}/12`; }).join(", ");
    return {cat:"Comparing Fractions",text:`Which of these fractions is the ${small?"smallest":"largest"}?`,answer:c,
      options:shuffle(set),why:`In twelfths: ${twelfths}. The ${small?"smallest":"largest"} is ${c}.`}; },

  // 7. Add fractions, same denominator
  ()=>{ const d=rnd(5,12), a=rnd(1,d-1), b=rnd(1,d-1), N=a+b, ans=fmtFrac(N,d);
    return build("Adding Fractions",`Add: ${a}/${d} + ${b}/${d}. Give your answer in simplest form.`,ans,
      ()=>pick([fmtFrac(N,2*d),fmtFrac(N+rnd(-2,2),d),fmtFrac(a*b,d),fmtFrac(N+rnd(1,3),d)]),
      `The denominators are the same, so add the numerators: ${a} + ${b} = ${N}. ${N}/${d}`+(ans!==`${N}/${d}`?` = ${ans}`:"")+"."); },

  // 8. Subtract fractions, same denominator
  ()=>{ const d=rnd(5,12), a=rnd(2,d-1), b=rnd(1,a-1), N=a-b, ans=fmtFrac(N,d);
    return build("Subtracting Fractions",`Subtract: ${a}/${d} − ${b}/${d}. Give your answer in simplest form.`,ans,
      ()=>pick([fmtFrac(N,d+rnd(1,3)),fmtFrac(N+rnd(-2,2),d),fmtFrac(a+b,d),fmtFrac(N+rnd(1,3),d)]),
      `The denominators are the same, so subtract the numerators: ${a} − ${b} = ${N}. ${N}/${d}`+(ans!==`${N}/${d}`?` = ${ans}`:"")+"."); },

  // 9. Add fractions, different denominators
  ()=>{ const q=unlikeAdd();
    return build("Adding Fractions",`Add: ${q.a}/${q.d1} + ${q.c}/${q.d2}`,q.ans,q.wrong,q.why); },

  // 10. Subtract fractions, different denominators
  ()=>{ const q=unlikeSub();
    return build("Subtracting Fractions",`Subtract: ${q.a}/${q.d1} − ${q.c}/${q.d2}`,q.ans,q.wrong,q.why); },

  // 11. Improper fraction -> mixed number
  ()=>{ let d,r; do{ d=rnd(2,9); r=rnd(1,d-1); }while(gcd(r,d)!==1);
    const w=rnd(1,5), n=w*d+r, c=`${w} ${r}/${d}`;
    return build("Mixed Numbers",`Change ${n}/${d} to a mixed number.`,c,
      ()=>pick([`${w+1} ${r}/${d}`,`${w} ${d-r}/${d}`,`${w>1?w-1:w+2} ${r}/${d}`,`${w} ${r}/${d+1}`]),
      `${n} ÷ ${d} = ${w} remainder ${r}, so ${n}/${d} = ${c}.`); },

  // 12. Mixed number -> improper fraction
  ()=>{ let d,r; do{ d=rnd(2,9); r=rnd(1,d-1); }while(gcd(r,d)!==1);
    const w=rnd(1,6), n=w*d+r, c=`${n}/${d}`;
    return build("Mixed Numbers",`Change ${w} ${r}/${d} to an improper fraction.`,c,
      ()=>pick([`${w+r}/${d}`,`${w*d}/${d}`,`${n+rnd(-2,2)}/${d}`,`${w*r+d}/${d}`]),
      `${w} × ${d} + ${r} = ${n}, so ${w} ${r}/${d} = ${c}.`); },

  // 13. Add / subtract mixed numbers
  ()=>{ let d1,d2,w1,n1,w2,n2,L,N1,N2,add;
    do{ d1=pick([2,3,4,5,6]); d2=pick([d1,d1,d1*2]);
        w1=rnd(1,5); n1=rnd(1,d1-1); w2=rnd(1,4); n2=rnd(1,d2-1); L=lcm(d1,d2);
        N1=(w1*d1+n1)*(L/d1); N2=(w2*d2+n2)*(L/d2); add=rnd(0,1)===0;
        if(!add && N1<N2){ [w1,w2]=[w2,w1]; [n1,n2]=[n2,n1]; [d1,d2]=[d2,d1]; [N1,N2]=[N2,N1]; }
    }while(!add && N1===N2);
    const N=add?N1+N2:N1-N2, ans=fmtFrac(N,L), op=add?"+":"−";
    return build("Mixed Numbers",`${add?"Add":"Subtract"}: ${w1} ${n1}/${d1} ${op} ${w2} ${n2}/${d2}`,ans,
      ()=>pick([fmtFrac(N+rnd(1,3),L),fmtFrac(N-rnd(1,3),L),fmtFrac(N+L,L),fmtFrac(N-L,L)]),
      `Change to improper fractions with denominator ${L}: ${N1}/${L} ${op} ${N2}/${L} = ${N}/${L}`+(ans!==`${N}/${L}`?` = ${ans}`:"")+"."); },

  // 14. Lowest common denominator
  ()=>{ let d1,d2; do{ d1=rnd(2,9); d2=rnd(2,9); }while(d1===d2||d1%d2===0||d2%d1===0);
    const L=lcm(d1,d2);
    return build("Common Denominators",`What is the lowest common denominator of 1/${d1} and 1/${d2}?`,L,
      ()=>pick([d1*d2,d1+d2,Math.max(d1,d2),L*2,L+rnd(1,4),L-rnd(1,4)]),
      `The smallest number that both ${d1} and ${d2} divide into exactly is ${L}.`); },

  // 15. Word problem: addition
  ()=>{ const q=unlikeAdd(), n=pick(NAMES), A=`${q.a}/${q.d1}`, C=`${q.c}/${q.d2}`;
    const text=pick([
      `${n} drank ${A} of a litre of milk in the morning and ${C} of a litre in the evening. How many litres did ${n} drink altogether?`,
      `A tailor used ${A} of a metre of cloth for a shirt and ${C} of a metre for a hat. How many metres of cloth did he use altogether?`,
      `${n} walked ${A} of a kilometre to school and ${C} of a kilometre to the market. How many kilometres did ${n} walk altogether?`
    ]);
    return build("Word Problems",text,q.ans,q.wrong,q.why); },

  // 16. Word problem: subtraction
  ()=>{ const q=unlikeSub(), n=pick(NAMES), A=`${q.a}/${q.d1}`, C=`${q.c}/${q.d2}`;
    const text=pick([
      `${n} had ${A} of a litre of juice and used ${C} of a litre. How many litres of juice are left?`,
      `A rope is ${A} of a metre long. ${n} cuts off ${C} of a metre. How many metres of rope remain?`,
      `${n} bought ${A} of a kilogram of sugar and used ${C} of a kilogram. How many kilograms of sugar are left?`
    ]);
    return build("Word Problems",text,q.ans,q.wrong,q.why); }
];

function makeQuestions(total){
  const out=[], seen=new Set();
  for(let i=0;i<total;i++){
    let q,t=0;
    do{ q=makers[i%makers.length](); }while(seen.has(q.text) && ++t<8);
    seen.add(q.text); out.push(q);
  }
  return shuffle(out);
}

/* ============ 3. THE GAME ============ */
const $=id=>document.getElementById(id);
let Q=[],i=0,score=0,streak=0,best=0,player="";

$("school").textContent=CONFIG.school; $("title").textContent=CONFIG.title;
$("topics").textContent=CONFIG.topics; $("quote").textContent=CONFIG.quote;
$("teacher").textContent="👨‍🏫 Teacher: "+CONFIG.teacherName+" • "+CONFIG.teacherPhone;
document.title=CONFIG.school.replace(/[^\w\s]/g,"").trim()+" - Math Quest Unit 4";

function show(id){ ["startScreen","quizScreen","endScreen"].forEach(s=>$(s).classList.toggle("hidden",s!==id)); window.scrollTo(0,0); }

$("startBtn").onclick=()=>{
  player=$("nameInput").value.trim().toUpperCase()||"STUDENT";
  $("who").textContent="🧒🎓 "+player;
  Q=makeQuestions(CONFIG.total); i=0; score=0; streak=0; best=0;
  show("quizScreen"); render();
};
$("againBtn").onclick=()=>show("startScreen");
$("nextBtn").onclick=()=>{ i++; i<Q.length?render():finish(); };

function render(){
  const q=Q[i];
  $("cat").textContent=q.cat; $("qn").textContent=`Question ${i+1} / ${Q.length}`;
  $("bar").style.width=(i/Q.length*100)+"%";
  $("score").textContent=score; $("streak").textContent=streak;
  $("question").innerHTML=toHTML(q.text);
  $("msg").className="msg"; $("nextBtn").classList.add("hidden");
  const box=$("options"); box.innerHTML="";
  q.options.forEach(v=>{
    const b=document.createElement("button");
    b.className="opt"; b.dataset.v=v; b.innerHTML=toHTML(v);
    b.onclick=()=>answer(b,v);
    box.appendChild(b);
  });
}

function answer(btn,v){
  const q=Q[i], ok=(v===q.answer);
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===q.answer) b.classList.add("right");
  });
  if(ok){ score+=CONFIG.pointsPerCorrect; streak++; best=Math.max(best,streak); }
  else  { btn.classList.add("wrong"); streak=0; }
  $("score").textContent=score; $("streak").textContent=streak;
  const m=$("msg"); m.className="msg "+(ok?"ok":"no");
  m.innerHTML=(ok?"✅ Correct! ":"❌ Not quite. ")+toHTML(q.why);
  $("nextBtn").textContent=(i===Q.length-1)?"See my result 🏆":"Next ➜";
  $("nextBtn").classList.remove("hidden");
  $("bar").style.width=((i+1)/Q.length*100)+"%";
}

let last={};
$("sendBtn").onclick=()=>{
  const d=new Date().toLocaleDateString("en-GB");
  const msg=`Hello Teacher ${CONFIG.teacherName},\n`+
    `📚 ${CONFIG.title.replace(/[^\w\s&•-]/g,"").trim()}\n`+
    `School: ${CONFIG.school.replace(/[^\w\s]/g,"").trim()}\n`+
    `Name: ${last.player}\nDate: ${d}\n`+
    `Score: ${last.score} / ${last.max} (${last.pct}%)\n`+
    `Best streak: ${last.best}`;
  const num=(CONFIG.teacherWhatsApp||"").replace(/\D/g,"");
  const url=(num.length>=9?`https://wa.me/${num}`:"https://wa.me/")+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
};

function finish(){
  const max=Q.length*CONFIG.pointsPerCorrect, pct=Math.round(score/max*100);
  last={player,score,max,pct,best};
  $("medal").textContent=pct>=80?"🏆":pct>=50?"🥈":"💪";
  $("endTitle").textContent=`Well done, ${player}!`;
  $("endText").innerHTML=`Score: <b>${score} / ${max}</b> (${pct}%)<br>Best streak: <b>🔥 ${best}</b><br>`+
    (pct>=80?"Excellent work!":pct>=50?"Good job! Try again to beat your score.":"Keep practising — you can do it!");
  show("endScreen");
}
</script>
</body>
